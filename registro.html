<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Patitas Felices | Registro</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>

<header class="Headthing">

    <div class="logo">
        🐾 PATITAS FELICES
    </div>

    <nav>

        <a href="index.html">Inicio</a>

        <a href="nosotros.html">Nosotros</a>

        <a href="productos.html">Productos</a>

        <a href="carrito.html">Carrito </a>

    </nav>

</header>


<main class="formulario-contenedor">

    <div class="formulario">

        <h1>Crear cuenta</h1>

        <p>
            Regístrate para realizar tus pedidos.
        </p>


        <form id="registroForm">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ingrese su nombre"
                required>


            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                placeholder="correo@ejemplo.com"
                required>


            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Ingrese una contraseña"
                required>


            <label for="telefono">
                Teléfono
            </label>

            <input
                type="tel"
                id="telefono"
                placeholder="Ingrese su teléfono"
                required>


            <button
                type="submit"
                class="boton">

                Registrarme

            </button>

        </form>


        <p class="formulario-link">

            ¿Ya tienes una cuenta?

            <a href="login.html">
                Inicia sesión
            </a>

        </p>

    </div>

</main>


<footer>

    <p>🐾 © 2026 Patitas Felices. Todos los derechos reservados.</p>

</footer>


<script type="module" src="js/main.js"></script>

</body>
</html>
