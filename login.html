    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>

<header class="Headthing">
<div class="logo">
       <img src="assets/PATITAS.jpg" alt="Logo de Patitas Felices" class="logo-img">
       PATITAS FELICES

    </nav>

</header>


<main class="formulario-contenedor">

    <div class="formulario">

        <h1>Iniciar sesión</h1>

        <p>
            Ingresa a tu cuenta para realizar tus pedidos.
        </p>


        <form id="loginForm">

            <label for="loginCorreo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="loginCorreo"
                placeholder="correo@ejemplo.com"
                required>


            <label for="loginPassword">
                Contraseña
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Ingrese su contraseña"
                required>


            <button
                type="submit"
                class="boton">

                Iniciar sesión

            </button>

        </form>


        <p class="formulario-link">

            ¿No tienes una cuenta?

            <a href="registro.html">
                Regístrate aquí
            </a>

        </p>

    </div>

</main>
